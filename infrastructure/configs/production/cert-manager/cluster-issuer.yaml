# Let's Encrypt production, DNS-01 through Cloudflare: no inbound connection is
# needed, so it issues for names that resolve only on the LAN (qa.infotropyiq.com).
# The token Secret cloudflare-api-token (key api-token) lives in namespace
# cert-manager and is created by hand. The base "letsencrypt" issuer is unchanged.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: sandysandesh28@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
