apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-scraper-ritest
  namespace: data-scraper
  labels:
    app: data-scraper-ritest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-scraper-ritest
  template:
    metadata:
      labels:
        app: data-scraper-ritest
    spec:
      containers:
        - name: data-scraper-ritest
          image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:0a573d0
          imagePullPolicy: IfNotPresent # Important for using remote images
          ports:
            - containerPort: 3000
          env:
            - name: COUNTRY
              value: FR
            - name: METHOD
              value: main
            - name: ORDER
              value: asc
            - name: LIMIT
              value: "100"
            - name: RATE_LIMIT_MAX_CONCURRENT
              value: "1"
            - name: RATE_LIMIT_SHARED_TOKEN_PODS
              value: "2"
            # ZoomInfo blocks every token for ~5 min when all scraper pods together exceed ~170 req/min.
            # 2.5 s per pod caps 6 pods at 144/min. Keep pods x 60000 / this value under ~150.
            - name: RATE_LIMIT_MIN_TIME
              value: "2500"
            - name: ziaccesstoken
              valueFrom:
                secretKeyRef:
                  name: zi-app-secret-ritest
                  key: ziaccesstoken
          envFrom:
            - secretRef:
                name: data-scraper-secrets
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
              cpu: "100m"
      imagePullSecrets:
        - name: ghcr-login-secret
---
