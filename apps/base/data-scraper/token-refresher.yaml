# ─── ZoomInfo Token Auto-Refresher ───────────────────────────────────────────
#
# Apply with:
#   kubectl apply -f k8s/token-refresher.yaml
#
# Before applying:
#   1. Replace <YOUR_APP_SECRET_NAME> with the name of the existing k8s Secret
#      that holds the "ziaccesstoken" key (the one your 3 pods currently read).
#   2. Replace <BASE64_USERNAME> and <BASE64_PASSWORD> with:
#         echo -n 'admin@isandeshsol.com' | base64
#         echo -n 'YOUR_PASSWORD' | base64
#   3. Leave ZI_REFRESH_TOKEN empty (Zm9v = base64("foo")); it will be
#      auto-populated after the first successful run.
#
# To trigger a manual test run after applying:
#   kubectl create job --from=cronjob/token-refresher token-refresher-manual \
#     -n data-scraper

---
# 1. ServiceAccount used by the CronJob Pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-refresher
  namespace: data-scraper

---
# 2. Role — minimum permissions needed
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-refresher
  namespace: data-scraper
rules:
  # Read + patch Secrets (app secret + credentials secret)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
  # Patch Deployments (rolling restart via annotation)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]

---
# 3. RoleBinding — bind ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-refresher
  namespace: data-scraper
subjects:
  - kind: ServiceAccount
    name: token-refresher
    namespace: data-scraper
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: token-refresher

---
# 4. Refresher config secret
#    Tells the script which users to process and which secret/deployment belongs to each one.
#    Each user owns a separate credentials secret and app secret; refresh tokens are never shared.
#
#    Example values (base64 not required in this config block because the refresher expects a JSON payload):
#    ZI_USER_CONFIGS='[{"name":"au","appSecretName":"zi-app-secret-au","credentialsSecretName":"zi-credentials-au","deploymentNames":["data-scraper-au","data-scraper-au-desc"]},{"name":"support","appSecretName":"zi-app-secret-support","credentialsSecretName":"zi-credentials-support","deploymentNames":["data-scraper-shailja"]}]'
#
#    Each user credentials secret should hold values like ZI_USERNAME, ZI_PASSWORD, ZI_REFRESH_TOKEN,
#    ZI_REDIRECT_URI, ZI_TOTP_SECRET, ZI_CLIENT_ID, and ZI_TOKEN_URL.
apiVersion: v1
kind: Secret
metadata:
  name: zi-refresher-config
  namespace: data-scraper
type: Opaque
stringData:
  ZI_USER_CONFIGS: >
    [
      {"name":"au","appSecretName":"zi-app-secret-au","credentialsSecretName":"zi-credentials-au","deploymentNames":["data-scraper-au","data-scraper-au-desc","data-scraper-germany"]},
      {"name":"ritest","appSecretName":"zi-app-secret-ritest","credentialsSecretName":"zi-credentials-ritest","deploymentNames":["data-scraper-ritest","data-scraper-ritest-desc","data-scraper-ritest-new"]},
      {"name":"support","appSecretName":"zi-app-secret-support","credentialsSecretName":"zi-credentials-support","deploymentNames":["data-scraper-shailja","data-scraper-shailja-desc","data-scraper-shailja-new"]}
    ]
---
# 5. CronJob — runs every day at 5:00 AM
#    Schedule: "0 5 * * *"  → runs at minute 0, hour 5
#    This ensures the token is refreshed well before the 24-hour expiry.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: token-refresher
  namespace: data-scraper
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid # don't overlap if a job is still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2 # retry up to 2 times on failure
      template:
        spec:
          serviceAccountName: token-refresher
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-login-secret
          containers:
            - name: token-refresher
              # Reuses the same scraper image — no extra build needed
              image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:12591fc
              imagePullPolicy: Always
              # Override the default CMD to run the refresh script
              command: ["node", "dist/scripts/refresh-zi-token.js"]
              envFrom:
                - secretRef:
                    name: zi-refresher-config
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
