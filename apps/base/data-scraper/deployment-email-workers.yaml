---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-bootstrap-workers
  namespace: data-scraper
  labels:
    app: email-bootstrap-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-bootstrap-workers
  template:
    metadata:
      labels:
        app: email-bootstrap-workers
    spec:
      containers:
        - name: email-bootstrap-workers
          image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:e8bea06
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/scripts/email-pipeline.js", "--workers"]
          env:
            - name: EMAIL_WORKER_QUEUES
              value: domain-bootstrap
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-replication.data-scraper.svc.cluster.local:6379"
          envFrom:
            - secretRef:
                name: data-scraper-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-login-secret
