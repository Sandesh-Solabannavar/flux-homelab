---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-verify-workers
  namespace: data-scraper
  labels:
    app: email-verify-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-verify-workers
  template:
    metadata:
      labels:
        app: email-verify-workers
    spec:
      terminationGracePeriodSeconds: 150 # longer than EMAIL_VERIFY_JOB_TIMEOUT_MS (120s), so a stop lets running jobs finish
      containers:
        - name: email-verify-workers
          image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:0a573d0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/scripts/email-pipeline.js", "--workers"]
          env:
            - name: EMAIL_WORKER_QUEUES
              value: email-verify,email-collide
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-replication.data-scraper.svc.cluster.local:6379"
            # Self-hosted Reacher verifier: checked first, free; per-domain pacing shared via Redis.
            - name: REACHER_PER_DOMAIN_PER_MINUTE
              value: "3"
            # Set to "false" to never send Reacher's unknowns to Hunter/ZeroBounce/NeverBounce.
            - name: EMAIL_PAID_FALLBACK
              value: "true"
          envFrom:
            - secretRef:
                name: data-scraper-secrets
            - secretRef:
                name: zi-verifier # REACHER_URL / REACHER_SECRET; required so a missing secret fails loudly
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-login-secret
