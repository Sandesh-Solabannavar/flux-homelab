apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-scraper-au
  namespace: data-scraper
  labels:
    app: data-scraper-au
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-scraper-au
  template:
    metadata:
      labels:
        app: data-scraper-au
    spec:
      containers:
        - name: data-scraper-au
          image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:8619ae1
          imagePullPolicy: IfNotPresent # Important for using remote images
          ports:
            - containerPort: 3000
          env:
            - name: COUNTRY
              value: SE
            - name: METHOD
              value: main
            - name: ORDER
              value: asc
            - name: LIMIT
              value: "100"
            - name: ziaccesstoken
              valueFrom:
                secretKeyRef:
                  name: zi-app-secret-au
                  key: ziaccesstoken
          envFrom:
            - secretRef:
                name: data-scraper-secrets
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
              cpu: "100m"
      imagePullSecrets:
        - name: ghcr-login-secret
---
