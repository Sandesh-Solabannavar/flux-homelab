# InfotropyIQ QA API (source: github.com/infotropy-iq/infotropyiq).
# The app repository's "Deploy QA" workflow pushes a main-* tag on every merge
# to main; Flux image automation rewrites both image tags; see
# apps/production/infotropyIQ-qa/image-automation.yaml.
# The whole environment, DATABASE_URL included, comes from the hand-made Secret
# infotropyiq-qa-server-env (see the app repo's docs/deployment/qa.md).
# The front door (deployment-front-door.yaml) reaches it at Service
# infotropyiq-server-origin. Live updates come from the front door's
# WorkspaceHub: with REALTIME_HUB_URL set, the server publishes its own events
# to the front door's /internal/realtime/publish, signed with
# REALTIME_RELAY_SECRET from the Secret, and serves no server-sent events.
# Background jobs: the front door runs the jobs placed on the Worker (its
# JOBS_ENABLED); this server runs only the Bun-only ones (BACKGROUND_JOBS=bun-only,
# which needs REALTIME_HUB_URL; without it the server runs every job).
# Rollback: first BACKGROUND_JOBS=all here, then the front door's JOBS_ENABLED off,
# and only then remove REALTIME_HUB_URL (see the app repo's docs/deployment/qa.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infotropyiq-server-qa
  namespace: infotropyiq
  labels:
    app: infotropyiq-server-qa
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  # Keep the ready pod until the new one passes its migration and readiness check.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infotropyiq-server-qa
  template:
    metadata:
      labels:
        app: infotropyiq-server-qa
        policy-type: "app"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # The migrator takes a PostgreSQL advisory lock, so pods starting together are safe.
        - name: migrate
          image: ghcr.io/infotropy-iq/infotropyiq-server:main-20261127085927-364bbad # {"$imagepolicy": "infotropyiq:infotropyiq-server-qa"}
          workingDir: /app/packages/db
          command: ["bun", "src/migrate.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: DATABASE_URL
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
      containers:
        - name: server
          image: ghcr.io/infotropy-iq/infotropyiq-server:main-20261127085927-364bbad # {"$imagepolicy": "infotropyiq:infotropyiq-server-qa"}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: infotropyiq-qa-server-env
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: DATABASE_URL
            - name: DATABASE_POOL_MAX
              value: "5"
            - name: CORS_ORIGIN
              value: "https://qa.infotropyiq.com"
            - name: MCP_PUBLIC_URL
              value: "https://qa.infotropyiq.com/mcp"
            - name: MEDIA_FFPROBE_PATH
              value: "/usr/bin/ffprobe"
            # The media service (deployment-media.yaml) verifies media for this
            # server's jobs too, instead of its own ffprobe. The token is also in
            # envFrom; named here so a Secret without it stops the rollout.
            - name: MEDIA_URL
              value: "http://infotropyiq-media:8080"
            - name: MEDIA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: MEDIA_SERVICE_TOKEN
            # Files on QA's Garage (files-qa.yaml); the R2-named keys in envFrom hold
            # Garage's key pair.
            - name: OBJECT_STORAGE_ENDPOINT
              value: "https://files.qa.infotropyiq.com"
            - name: OBJECT_STORAGE_PATH_STYLE
              value: "true"
            - name: MEDIA_CLIP_MAX_BYTES
              value: "100000000" # 100 MB max for media clips
            - name: MEDIA_CLIP_MAX_SECONDS
              value: "900" # 900 seconds max for media clips
            - name: MEDIA_DICTATION_MAX_BYTES
              value: "10000000" # 10 MB max for media dictations
            - name: MEDIA_DICTATION_MAX_SECONDS
              value: "120" # 120 seconds max for media dictations
            - name: MEDIA_MAX_CONCURRENT
              value: "2" # Maximum number of concurrent media operations
            - name: MEDIA_REVIEW_HOURS
              value: "24" # Maximum number of hours for media review
            - name: MEDIA_TRASH_DAYS
              value: "30" # Maximum number of days for media trash
            # The front door (Service infotropyiq-server), which hosts the live-update hub.
            - name: REALTIME_HUB_URL
              value: "http://infotropyiq-server:3000"
            # Only the jobs the Worker cannot run (media and Notetaker recovery, automation
            # webhooks); the front door's Worker runs the rest. Set only after the front door's
            # /health/jobs reported a finished run. Rollback: set "all" first.
            - name: BACKGROUND_JOBS
              value: "bun-only"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
