# Named exactly infotropyiq-server: the web image's nginx proxies the API paths
# to that host name. It selects the API Worker (statefulset-front-door.yaml), which
# serves every route; nothing is forwarded to the Bun server any more.
apiVersion: v1
kind: Service
metadata:
  name: infotropyiq-server
  namespace: infotropyiq
spec:
  selector:
    app: infotropyiq-front-door-qa
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 8787
