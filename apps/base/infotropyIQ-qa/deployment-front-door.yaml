# InfotropyIQ QA front door (source: github.com/infotropy-iq/infotropyiq): the
# staging API Worker (apps/server/src/worker.ts) under `wrangler dev`, in front of
# the QA API server, so the forwarding and relay code staging runs on Cloudflare
# is exercised in QA first. It serves QA once Service infotropyiq-server (the web
# image's nginx upstream, service-server.yaml) selects it, and forwards what the
# Worker does not serve to Service infotropyiq-server-origin. See the app repo's
# docs/deployment/qa.md.
# The app repository's "Deploy QA" workflow pushes a main-* tag on every merge to
# main; Flux image automation rewrites the tag; see
# apps/production/infotropyIQ-qa/image-automation.yaml.
# Only the keys below come from the Secret infotropyiq-qa-server-env, never all of
# it; the image's entry script passes the Worker only the keys the server's
# .env.schema declares (DATABASE_URL excepted). The fixed values mirror the
# server Deployment's, minus DATABASE_URL, DATABASE_POOL_MAX and MEDIA_FFPROBE_PATH,
# as staging's Worker config does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infotropyiq-front-door-qa
  namespace: infotropyiq
  labels:
    app: infotropyiq-front-door-qa
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  # Keep the ready pod until the new one has bundled the Worker and passes its readiness check.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infotropyiq-front-door-qa
  template:
    metadata:
      labels:
        app: infotropyiq-front-door-qa
        policy-type: "app"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: front-door
          # Placeholder until "Deploy QA" publishes the first front-door image; replace
          # it with that tag before merging (Flux keeps it current afterwards).
          image: ghcr.io/infotropy-iq/infotropyiq-front-door:main-20261126195625-8f5dbdb # {"$imagepolicy": "infotropyiq:infotropyiq-front-door-qa"}
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: NODE_ENV
              value: "production"
            - name: CORS_ORIGIN
              value: "https://qa.infotropyiq.com"
            - name: MCP_PUBLIC_URL
              value: "https://qa.infotropyiq.com/mcp"
            - name: MEDIA_CLIP_MAX_BYTES
              value: "100000000"
            - name: MEDIA_CLIP_MAX_SECONDS
              value: "900"
            - name: MEDIA_DICTATION_MAX_BYTES
              value: "10000000"
            - name: MEDIA_DICTATION_MAX_SECONDS
              value: "120"
            - name: MEDIA_MAX_CONCURRENT
              value: "2"
            - name: MEDIA_REVIEW_HOURS
              value: "24"
            - name: MEDIA_TRASH_DAYS
              value: "30"
            # The Bun pods. Inside the cluster there is no Cloudflare Access, so
            # ORIGIN_ACCESS_CLIENT_ID/SECRET stay unset and no Access header is sent.
            - name: ORIGIN_URL
              value: "http://infotropyiq-server-origin:3000"
            # Runs the background jobs placed on the Worker: the JobClock Durable Object and
            # the jobs queue under wrangler dev (requests arm the clock; wrangler dev fires no
            # cron). An image from before the JobClock ignores it. The server keeps running
            # every job until a second change sets its BACKGROUND_JOBS=bun-only, after this
            # pod's /health/jobs reports a finished run (the app repo's docs/deployment/qa.md).
            # Rollback: the server back to BACKGROUND_JOBS=all first, then remove this.
            - name: JOBS_ENABLED
              value: "true"
            # wrangler dev's local Hyperdrive: the Worker's own queries go to the QA database.
            - name: CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_DATABASE
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: DATABASE_URL
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLERK_SECRET_KEY
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLERK_PUBLISHABLE_KEY
            # Verifies the live updates the server publishes to the hub; the server signs
            # them with the same key.
            - name: REALTIME_RELAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: REALTIME_RELAY_SECRET
            # Signs and verifies the 60 s tickets browsers open the live-update socket with.
            - name: REALTIME_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: REALTIME_TICKET_SECRET
            # Files go over R2's S3 API with QA's bucket; without these the Worker's file
            # procedures are off, as the server's are.
            - name: CLOUDFLARE_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLOUDFLARE_R2_ACCOUNT_ID
                  optional: true
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLOUDFLARE_R2_BUCKET
                  optional: true
            - name: CLOUDFLARE_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLOUDFLARE_R2_ACCESS_KEY_ID
                  optional: true
            - name: CLOUDFLARE_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
                  optional: true
            # AI, when QA has it configured.
            - name: AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: AI_GATEWAY_API_KEY
                  optional: true
            - name: AI_GENERATION
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: AI_GENERATION
                  optional: true
            - name: AI_MODEL_MAP
              valueFrom:
                secretKeyRef:
                  name: infotropyiq-qa-server-env
                  key: AI_MODEL_MAP
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # wrangler, workerd and wrangler's bundler service stay resident: about
          # 800 MiB in use after a few dozen requests (measured locally).
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
