# The app repository's "Deploy QA" workflow runs on every merge to main and pushes
#   ghcr.io/infotropy-iq/infotropyiq-server:main-<UTC yyyymmddHHMMSS>-<short sha>
#   ghcr.io/infotropy-iq/infotropyiq-front-door:main-<UTC yyyymmddHHMMSS>-<short sha>
#   ghcr.io/infotropy-iq/infotropyiq-media:main-<UTC yyyymmddHHMMSS>-<short sha>
#   ghcr.io/infotropy-iq/infotropyiq-migrate:main-<UTC yyyymmddHHMMSS>-<short sha>
#   ghcr.io/infotropy-iq/infotropyiq-web:qa-<UTC yyyymmddHHMMSS>-<short sha>
# Flux picks the newest timestamp of each, rewrites the tags in
# apps/base/infotropyIQ-qa/ and commits them to main. The flux-image-updates
# GitRepository is in apps/production/infotropyIQ/image-automation.yaml; the server
# ImageRepository moved here when the k3s staging server was retired (2026-11-27).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: infotropyiq-server
  namespace: infotropyiq
spec:
  image: ghcr.io/infotropy-iq/infotropyiq-server
  interval: 1m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: infotropyiq-web
  namespace: infotropyiq
spec:
  image: ghcr.io/infotropy-iq/infotropyiq-web
  interval: 1m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: infotropyiq-front-door
  namespace: infotropyiq
spec:
  image: ghcr.io/infotropy-iq/infotropyiq-front-door
  interval: 1m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: infotropyiq-media
  namespace: infotropyiq
spec:
  image: ghcr.io/infotropy-iq/infotropyiq-media
  interval: 1m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: infotropyiq-server-qa
  namespace: infotropyiq
spec:
  imageRepositoryRef:
    name: infotropyiq-server
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: infotropyiq-front-door-qa
  namespace: infotropyiq
spec:
  imageRepositoryRef:
    name: infotropyiq-front-door
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: infotropyiq-media-qa
  namespace: infotropyiq
spec:
  imageRepositoryRef:
    name: infotropyiq-media
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: infotropyiq-web-qa
  namespace: infotropyiq
spec:
  imageRepositoryRef:
    name: infotropyiq-web
  filterTags:
    pattern: '^qa-(?P<ts>[0-9]{14})-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
# No policySelector: it applies every ImagePolicy in this namespace to the markers
# under its path, so infotropyiq-front-door-qa needs nothing more here.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: infotropyiq-qa
  namespace: infotropyiq
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-image-updates
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |-
        deploy(infotropyiq): QA images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./apps/base/infotropyIQ-qa
    strategy: Setters
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: infotropyiq-migrate
  namespace: infotropyiq
spec:
  image: ghcr.io/infotropy-iq/infotropyiq-migrate
  interval: 1m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: infotropyiq-migrate-qa
  namespace: infotropyiq
spec:
  imageRepositoryRef:
    name: infotropyiq-migrate
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-[0-9a-f]{7}$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
