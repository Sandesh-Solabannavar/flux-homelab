# Remotely managed tunnel "infotropyiq-stg": its routes live in the Cloudflare
# dashboard (Zero Trust > Networks > Tunnels), not here:
#   stg-api.infotropyiq.com -> http://infotropyiq-server-stg:3000
#   stg-db.infotropyiq.com  -> tcp://infotropyiq-stg-db-rw:5432 (Hyperdrive only, behind Access)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-stg
  namespace: infotropyiq
spec:
  selector:
    matchLabels:
      app: cloudflared-stg
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-stg
        policy-type: "app"
    spec:
      containers:
        - name: cloudflared-stg
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-stg
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - containerPort: 2000
              name: http-metrics
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      restartPolicy: Always
