apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-stg
  namespace: infotropyiq
spec:
  selector:
    matchLabels:
      app: cloudflared-stg
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-stg
        policy-type: "app"
    spec:
      containers:
        - name: cloudflared-stg
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - containerPort: 2000
              name: http-metrics
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds/
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: cloudflared-stg
            items:
              - key: config.yaml
                path: config.yaml
        - name: creds
          secret:
            secretName: cloudflare-tunnel-stg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-stg
  namespace: infotropyiq
data:
  config.yaml: |
    tunnel: infotropyiq-stg
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000

    no-autoupdate: true

    ingress:
    # The staging API.
    - hostname: stg-api.infotropyiq.com
      service: http://infotropyiq-server-stg:3000
    # PostgreSQL for the notifications worker's Hyperdrive only; Cloudflare
    # Access (service token) guards the hostname.
    - hostname: stg-db.infotropyiq.com
      service: tcp://infotropyiq-stg-db-rw:5432

    # This rule matches any traffic which didn't match a previous rule, and responds with HTTP 404.
    - service: http_status:404
