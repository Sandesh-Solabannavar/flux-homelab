apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: infotropyiq-stg-db-backup
  namespace: infotropyiq
spec:
  # Daily at 02:00 UTC
  schedule: "0 0 2 * * *"
  cluster:
    name: infotropyiq-stg-db
  backupOwnerReference: self
  # Take a backup immediately on first creation
  immediate: true
