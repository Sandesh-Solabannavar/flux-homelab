# Values live in Azure Key Vault (azure-kv-store); names only here.
---
# Every Key Vault entry named infotropyiq-stg-server-<kebab-case variable>
# becomes that server variable, e.g. infotropyiq-stg-server-clerk-secret-key
# -> CLERK_SECRET_KEY. Optional variables are simply left out of Key Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infotropyiq-stg-server-env
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: infotropyiq-stg-server-env
  dataFrom:
    - find:
        name:
          regexp: "^infotropyiq-stg-server-"
      rewrite:
        - regexp:
            source: "^infotropyiq-stg-server-(.*)$"
            target: "$1"
        - transform:
            template: '{{ .value | upper | replace "-" "_" }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infotropyiq-stg-db-credentials
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: infotropyiq-stg-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: infotropyiq
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: infotropyiq-stg-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infotropyiq-stg-r2-backup
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: infotropyiq-stg-r2-backup
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: infotropyiq-stg-r2-backup-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: infotropyiq-stg-r2-backup-secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-stg
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-tunnel-stg
  data:
    - secretKey: credentials.json
      remoteRef:
        key: infotropyiq-stg-tunnel-credentials
---
# Classic PAT with only read:packages, for the kubelet and Flux's image scanner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: infotropyiq-stg-ghcr-username
    - secretKey: token
      remoteRef:
        key: infotropyiq-stg-ghcr-token
---
# Write-enabled deploy key used only by image automation to commit tag updates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-image-updates
  namespace: infotropyiq
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: flux-image-updates
  data:
    - secretKey: identity
      remoteRef:
        key: infotropyiq-stg-flux-image-updates-identity
    - secretKey: identity.pub
      remoteRef:
        key: infotropyiq-stg-flux-image-updates-identity-pub
    - secretKey: known_hosts
      remoteRef:
        key: infotropyiq-stg-flux-image-updates-known-hosts
