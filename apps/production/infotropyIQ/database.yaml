apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infotropyiq-stg-db
  namespace: infotropyiq
spec:
  description: PostgreSQL for InfotropyIQ staging
  # PostgreSQL 18 matches the app's CI. The "system" flavor ships the Barman
  # Cloud tools the in-tree backup below needs; quay.io/enterprisedb has no 18.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  # One instance: the nodes' CPU requests are saturated (see ahey-chat).
  # Continuous WAL archiving to R2 plus daily base backups give 30-day PITR.
  instances: 1

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      app: infotropyiq-stg-database
      policy-type: "database"

  storage:
    storageClass: local-path
    size: 10Gi

  resources:
    requests:
      memory: 256Mi

  # 2 server replicas x (pool 10 + 2 realtime publishers + 1 LISTEN) = 26,
  # Hyperdrive origin limit <= 20, migrations, CNPG itself, headroom.
  postgresql:
    parameters:
      max_connections: "100"
      # Statement statistics for performance work. Setting these makes CloudNativePG
      # load the library (one restart of the instance) and create the extension.
      # "all" also counts statements run inside triggers and functions.
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: all
      # The volume is on SSD (local-path on k3s3, which reports its disk as
      # non-rotational), where a random page read costs about what a
      # sequential one does. At PostgreSQL's default of 4 the planner reads
      # whole tables to find one member's rows. Applied by a reload: the
      # instance does not restart.
      random_page_cost: "1.1"

  bootstrap:
    initdb:
      database: infotropyiq
      owner: infotropyiq
      secret:
        name: infotropyiq-stg-db-credentials

  backup:
    barmanObjectStore:
      destinationPath: s3://infotropyiq-stg-db-backups/
      endpointURL: https://6014a00d43509c341143e321b50c380a.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: infotropyiq-stg-r2-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: infotropyiq-stg-r2-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 8
      data:
        compression: gzip
        immediateCheckpoint: false
    retentionPolicy: "30d"
